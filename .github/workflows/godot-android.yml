name: Build PENALTY 2027 Godot 3D APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and Android templates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unzip wget
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godotbin
          sudo install -m 755 /tmp/godotbin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          cp /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Prepare Android SDK and debug keystore
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools" || true
          ls -la "$ANDROID_HOME/platforms" || true
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi
          ls -la "$ANDROID_HOME"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.4.tres"
          cat "$HOME/.config/godot/editor_settings-4.tres"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$HOME/.android/debug.keystore"
      - name: Import Godot assets
        run: godot --headless --path godot --editor --import --quit
      - name: Export Android APK
        run: |
          godot --headless --verbose --path godot --export-debug Android "$GITHUB_WORKSPACE/PENALTY-2027-3D.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PENALTY-2027-GODOT-3D-APK
          path: PENALTY-2027-3D.apk
          if-no-files-found: error
